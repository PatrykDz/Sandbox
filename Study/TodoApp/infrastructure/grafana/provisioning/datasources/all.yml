# Grafana data source provisioning — auto-configured on startup
apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      httpMethod:        POST
      exemplarTraceIdDestinations:
        - name:          traceID
          datasourceUid: tempo

  - name:   Tempo
    type:   tempo
    access: proxy
    url:    http://tempo:3200
    uid:    tempo
    editable: false
    jsonData:
      httpMethod:    GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "1h"
        spanEndTimeShift:   "-1h"
      spanBar:
        type: Tag
        tag:  http.path
      lokiSearch:
        datasourceUid: loki

  - name:   Loki
    type:   loki
    access: proxy
    url:    http://loki:3100
    uid:    loki
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex:  "traceId=(\\w+)"
          name:          TraceID
          url:           '$${__value.raw}'
          urlDisplayLabel: "View Trace"
