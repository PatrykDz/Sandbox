# IMPORTANT: Never commit real secrets. Use External Secrets Operator in production.
# All values here are base64(value) of placeholder strings.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: todoapp
type: Opaque
data:
  POSTGRES_PASSWORD: dG9kb2FwcF9wYXNzd29yZA==
  POSTGRES_USER: dG9kb2FwcA==

---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: todoapp
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: Z3Vlc3Q=
  RABBITMQ_DEFAULT_PASS: Z3Vlc3Q=

---
# Per-service DB connection strings (each service has its own database)
apiVersion: v1
kind: Secret
metadata:
  name: todo-service-secret
  namespace: todoapp
type: Opaque
stringData:
  CONNECTION_STRING: "Host=postgres;Port=5432;Database=todoapp;Username=todoapp;Password=todoapp_password;Pooling=true;MinPoolSize=5;MaxPoolSize=100;"

---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: todoapp
type: Opaque
stringData:
  CONNECTION_STRING: "Host=postgres;Port=5432;Database=userservice;Username=todoapp;Password=todoapp_password;Pooling=true;MinPoolSize=5;MaxPoolSize=100;"

---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: todoapp
type: Opaque
stringData:
  CONNECTION_STRING: "Host=postgres;Port=5432;Database=notificationservice;Username=todoapp;Password=todoapp_password;Pooling=true;MinPoolSize=2;MaxPoolSize=50;"

---
apiVersion: v1
kind: Secret
metadata:
  name: audit-service-secret
  namespace: todoapp
type: Opaque
stringData:
  CONNECTION_STRING: "Host=postgres;Port=5432;Database=auditservice;Username=todoapp;Password=todoapp_password;Pooling=true;MinPoolSize=2;MaxPoolSize=50;"
