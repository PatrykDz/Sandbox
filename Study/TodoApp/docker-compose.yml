services:
  # ╔══════════════════════════════════════════════════════════════╗
  # ║  INFRASTRUCTURE                                              ║
  # ╚══════════════════════════════════════════════════════════════╝

  postgres:
    image: postgres:16-alpine
    container_name: todoapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todoapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todoapp_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todoapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - todoapp-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: todoapp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - todoapp-network

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  APPLICATION SERVICES                                        ║
  # ╚══════════════════════════════════════════════════════════════╝

  todo-service:
    build:
      context: .
      dockerfile: src/Services/TodoService/TodoService.API/Dockerfile
    container_name: todoapp-todo-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=todoapp;Username=${POSTGRES_USER:-todoapp};Password=${POSTGRES_PASSWORD:-todoapp_password};Pooling=true;MinPoolSize=5;MaxPoolSize=100;"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${TODO_SERVICE_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - todoapp-network

  user-service:
    build:
      context: .
      dockerfile: src/Services/UserService/UserService.API/Dockerfile
    container_name: todoapp-user-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=userservice;Username=${POSTGRES_USER:-todoapp};Password=${POSTGRES_PASSWORD:-todoapp_password};Pooling=true;MinPoolSize=5;MaxPoolSize=100;"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${USER_SERVICE_PORT:-5001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - todoapp-network

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.Worker/Dockerfile
    container_name: todoapp-notification-service
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=notificationservice;Username=${POSTGRES_USER:-todoapp};Password=${POSTGRES_PASSWORD:-todoapp_password};Pooling=true;MinPoolSize=2;MaxPoolSize=50;"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - todoapp-network

  audit-service:
    build:
      context: .
      dockerfile: src/Services/AuditService/AuditService.API/Dockerfile
    container_name: todoapp-audit-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=auditservice;Username=${POSTGRES_USER:-todoapp};Password=${POSTGRES_PASSWORD:-todoapp_password};Pooling=true;MinPoolSize=2;MaxPoolSize=50;"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${AUDIT_SERVICE_PORT:-5002}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - todoapp-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  todoapp-network:
    driver: bridge
